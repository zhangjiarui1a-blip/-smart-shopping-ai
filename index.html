<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI 宠物购物助手，为宠物推荐合适商品。" />
    <title>AI 宠物购物助手</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="site-header">
        <a class="brand" href="#top" aria-label="AI 宠物购物助手首页">
          <span class="brand-icon" aria-hidden="true">✦</span><span>Petwise AI</span>
        </a>
        <span class="status"><i></i> 智能推荐已就绪</span>
      </header>

      <section class="hero" id="top" aria-labelledby="page-title">
        <div class="orb orb-one" aria-hidden="true"></div><div class="orb orb-two" aria-hidden="true"></div>
        <p class="eyebrow">YOUR PET'S SMART SHOPPING COMPANION</p>
        <h1 id="page-title">AI 宠物购物助手</h1>
        <p class="subtitle">输入宠物品种、年龄和预算，为你推荐适合的商品。</p>
        <div class="pet-pills" aria-label="适用宠物"><span>🐶 狗狗</span><span>🐱 猫咪</span><span>🐾 用心挑选</span></div>
      </section>

      <section class="chat-card" aria-labelledby="chat-title">
        <div class="chat-heading">
          <div class="ai-avatar" aria-hidden="true">✦</div>
          <div><p>Petwise AI</p><h2 id="chat-title">今天想为毛孩子挑点什么？</h2></div>
        </div>
        <div class="welcome-message">告诉我宠物的品种、年龄和预算，我会给你一份贴心的模拟购物建议。</div>
        <form id="assistantForm" class="chat-form">
          <label class="sr-only" for="recommendationInput">宠物购物需求</label>
          <input id="recommendationInput" name="query" maxlength="160" placeholder="例如：2 岁柯基，预算 300 元，想买主粮和玩具" autocomplete="off" />
          <button id="recommendButton" type="submit" aria-label="发送消息"><span>发送</span><b aria-hidden="true">↗</b></button>
        </form>
        <div class="quick-prompts" aria-label="快捷推荐">
          <button type="button" data-prompt="推荐狗粮">🐶 推荐狗粮</button>
          <button type="button" data-prompt="推荐猫粮">🐱 推荐猫粮</button>
          <button type="button" data-prompt="推荐零食">🦴 推荐零食</button>
          <button type="button" data-prompt="推荐玩具">🧶 推荐玩具</button>
        </div>
        <div id="recommendationResult" class="response" aria-live="polite" hidden></div>
      </section>

      <p class="disclaimer">本页面展示的是模拟 AI 推荐，不连接任何外部 AI 服务或商品接口。</p>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
